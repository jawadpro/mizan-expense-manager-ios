# Local demo: `docker compose up --build`, then open http://localhost:3000
# Sign in as demo@mizan.local with the password mizan-demo-2026. All data here is made up and stays on this computer.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan
      POSTGRES_DB: mizan
    volumes:
      - mizan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://mizan:mizan@db:5432/mizan
      DATABASE_SSL: "false"
      COOKIE_SECURE: "false"
      SEED_DEMO: "true"
      DEMO_PASSWORD: mizan-demo-2026
      SESSION_SECRET: local-demo-session-secret-change-me-0001
      SMS_INGEST_TOKEN: local-demo-sms-token-change-me-000000001
      CRON_SECRET: local-demo-cron-secret-change-me-00000001
      # While Paddle isn't set up, the plans page offers "Simulate payment" to switch Pro on. Local demo only.
      BILLING_TEST_MODE: "true"
      # Paddle sandbox, for trying Pro checkout. Put the values in a .env file next to this one.
      PADDLE_ENV: ${PADDLE_ENV:-sandbox}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_MONTHLY: ${PADDLE_PRICE_MONTHLY:-}
      PADDLE_PRICE_YEARLY: ${PADDLE_PRICE_YEARLY:-}

volumes:
  mizan-db:
